[package]
name = "vire"
version = "1.8.0"
edition = "2021"
description = "Vire - live wallpaper & dock taskbar for Windows"
build = "build.rs"

[[bin]]
name = "Vire"
path = "src/main.rs"

[dependencies]
# No bundled fonts: Segoe UI is loaded from Windows at runtime (keeps the exe ~1 MB smaller).
eframe = { version = "0.29", default-features = false, features = ["glow"] }
tray-icon = "0.19"
# PNG decode/encode + file dialog come from Windows itself (WIC, IFileOpenDialog), not crates.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "=0.58.0"
features = [
    "implement",
    "Foundation",
    "Storage",
    "Storage_Streams",
    "Media_Transcoding",
    "Media_MediaProperties",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "=0.58.0"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

